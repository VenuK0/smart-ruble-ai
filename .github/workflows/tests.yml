name: SmartRubleAI checks
on:
  push:
    branches:
      - main
      - coursework-analytics
  pull_request:
    branches:
      - main
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: python -m pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q src
      - name: Check interface JavaScript syntax
        run: |
          node --check src/smartruble/web/app.js
          node --check src/smartruble/web/export.js
          node --check src/smartruble/web/navigation.js
          node --check src/smartruble/web/receipt-utils.js
          node --check src/smartruble/web/history-utils.js
          node --check src/smartruble/web/antifraud-utils.js
          node --check src/smartruble/web/economics-utils.js
      - name: Test exports, navigation, receipts, ledger, anomalies and economics
        run: node --test tests/test_csv.mjs tests/test_navigation.mjs tests/test_receipt.mjs tests/test_history.mjs tests/test_antifraud_ui.mjs tests/test_economics_ui.mjs
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce synthetic stress evaluation
        run: PYTHONPATH=src python -m smartruble.robustness
      - name: Install browser smoke dependencies
        run: python -m pip install playwright==1.55.0
      - name: Check six real pages at five viewport widths
        run: |
          PYTHONPATH=src python -m uvicorn smartruble.api:app --host 127.0.0.1 --port 8765 > /tmp/smartruble-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          PYTHONPATH=src python tests/browser_smoke.py
      - name: Upload screen review snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartruble-viewport-review
          path: browser-artifacts/*.png
          if-no-files-found: ignore

