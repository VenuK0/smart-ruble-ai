name: Publish finance workspace RC2
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-workspace-rc2.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: VenuK0/smart-ruble-ai
        run: |
          set -euo pipefail
          if gh release view v0.2.0-rc.2 >/dev/null 2>&1; then
            echo 'Release already exists'
          else
            gh release create v0.2.0-rc.2 --target 7b891b57cf1cb5d042535820503a4503e9cc550a --title 'SmartRubleAI v0.2.0-rc.2 — финансовое рабочее место' --notes 'Предварительная версия. Светлый русскоязычный интерфейс финансового контроля с шестью отдельными страницами (/app), реестром смет, проверкой чеков, историей, синтетическим антифродом и экономическими сценариями. Предыдущая /demo сохранена. Исследовательская симуляция без реальных платежей. Авторы: Окунев В. И. и Штунь А. Р.' --prerelease --latest=false
          fi
      - name: Retire merged UI branch if unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: VenuK0/smart-ruble-ai
        run: |
          set -euo pipefail
          old=$(gh api repos/VenuK0/smart-ruble-ai/git/ref/heads/ui/finance-workspace --jq .object.sha 2>/dev/null || true)
          if [ "$old" = '7251ce1db2c14a7ecdc9732cbf9a9edaec91f627' ]; then
            gh api -X DELETE repos/VenuK0/smart-ruble-ai/git/refs/heads/ui/finance-workspace
          else
            echo "Skip branch cleanup: $old"
          fi
