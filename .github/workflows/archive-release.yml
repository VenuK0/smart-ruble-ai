name: Publish original forum snapshot
on:
  push:
    branches:
      - forum-v0.2
    paths:
      - .github/workflows/archive-release.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.1.0 once from archived original
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: VenuK0/smart-ruble-ai
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists, skipping"
          else
            gh release create v0.1.0 --target 6ad84288777d24749507cd4b961f3e8a789acd15 --title "SmartRubleAI v0.1.0 — конкурсный прототип" --notes "Исходный совместный прототип, сохраненный перед развитием forum-v0.2. Симуляция целевых расходов на синтетических данных, без интеграции с цифровым рублём. Авторы: Окунев В. И. и Штунь А. Р. Проверенный оригинальный коммит: 6ad8428." --latest=false
          fi
