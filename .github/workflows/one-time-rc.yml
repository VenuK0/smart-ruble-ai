name: Publish v0.2 release candidate and retire temporary branch
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-rc.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release candidate from verified main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: VenuK0/smart-ruble-ai
        run: |
          set -euo pipefail
          if gh release view v0.2.0-rc.1 >/dev/null 2>&1; then
            echo "Release candidate already exists"
          else
            gh release create v0.2.0-rc.1 \
              --target d826606c1f8a9aa1c0b659fee8ec12aba988f28e \
              --title "SmartRubleAI v0.2.0-rc.1 — Research Console" \
              --notes "Предварительная версия основной линии SmartRubleAI для проверки командой. Реализованы Research Console, расширенная валидация сумм, защита от повторных чеков, журнал SHA-256, API-тесты, синтетический антифрод, экономические сценарии, отчёт об устойчивости ML и документация. Прототип-симуляция без реальных платежей и интеграции с Банком России. Исходный выпуск v0.1.0 сохранён отдельно. Соавторы: Окунев В. И., Штунь А. Р." \
              --prerelease \
              --latest=false
          fi
      - name: Remove temporary development branch after merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: VenuK0/smart-ruble-ai
        run: |
          set -euo pipefail
          old=$(gh api repos/VenuK0/smart-ruble-ai/git/ref/heads/forum-v0.2 --jq .object.sha 2>/dev/null || true)
          if [ "$old" = "1d6f94c2223b93eb0e53aff194088482f5c46288" ]; then
            gh api -X DELETE repos/VenuK0/smart-ruble-ai/git/refs/heads/forum-v0.2
            echo "Retired merged temporary branch"
          else
            echo "Skipped deletion: temporary branch is missing or has new changes ($old)"
          fi
